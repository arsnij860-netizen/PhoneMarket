iv>`).join('')}<div class="section">Достижения</div>${(()=>{const profit=s.deals.reduce((n,d)=>n+d.profit,0),count=s.deals.length,assets=s.balance+s.phones.reduce((n,p)=>n+(p.market||0),0)+s.orders.reduce((n,p)=>n+(p.market||0),0);const list=[['Первая сделка','Заверши первую продажу',count>=1],['Малый бизнес','Заверши 5 продаж',count>=5],['Опытный продавец','Заверши 20 продаж',count>=20],['Первые 5 000 ₽','Получи прибыль от сделок 5 000 ₽',profit>=5000],['Капитал 50 000 ₽','Накопи 50 000 ₽ в балансе и активах',assets>=50000],['Коллекционер','Держи на складе 5 телефонов',s.phones.filter(p=>p.status==='Склад').length>=5],['Ремонт-мастер','Заверши ремонт телефона',s.events.some(e=>e.includes('Ремонт завершён'))]];return list.map(([name,desc,ok])=>'<div class="event" style="display:flex;gap:10px;align-items:center"><span style="font-size:22px">'+(ok?'🏆':'🔒')+'</span><div><b>'+name+'</b><div class="small">'+desc+'</div><div class="small" style="color:'+(ok?'var(--green)':'var(--muted)')+'">'+(ok?'Получено':'Ещё не получено')+'</div></div></div>').join('')})()}<div class="section">Промокоды</div><p class="muted">Введи промокод и забери награду. Каждый код действует один раз на сохранение.</p><div class="toolbar"><input class="field" id="promo-code" placeholder="Введи промокод…" maxlength="32" autocomplete="off"><button class="btn" onclick="redeemPromo()">Активировать</button></div><div class="small">Промокоды: KANER · CASH5000 · PIXEL9 · PROFIT</div><div class="small">Активный бонус прибыли: ${s.promo_profit_sales} продаж</div><div class="section">Сохранение</div><button class="btn secondary full" onclick="save();msg('Прогресс сохранён на этом устройстве.')">Сохранить игру</button><button class="btn danger full" onclick="newGame()">Начать заново</button>`} }
function redeemPromo(){const el=$('promo-code');const code=(el?.value||'').trim().toUpperCase();if(!code)return msg('Введи промокод.',true);if(s.redeemed_codes.includes(code))return msg('Этот промокод уже использован.',true);const rewards={KANER:'HONOR X9d',PIXEL9:'Google Pixel 9'};if(code==='CASH5000'){s.balance+=5000;tx('Промокод',5000,'CASH5000 — бонус 5 000 ₽');event('Активирован промокод CASH5000: +5 000 ₽.');}else if(code==='PROFIT'){s.promo_profit_sales+=5;event('Активирован промокод PROFIT: бонус +15% к выручке следующих 5 продаж.');}else if(rewards[code]){const model=MODELS.find(x=>x[0]===rewards[code]);if(!model)return msg('Модель награды отсутствует в каталоге.',true);const p=makePhone(model[0],model[1],model[2],model[3],0,'Отличное');p.market=model[2];p.price=model[2];p.battery=100;p.condition='Отличное';p.defects=[];p.hidden_defect=null;p.screen='Исправен';p.camera='Работает';p.charging='Исправен';p.status='Склад';p.cost=0;p.promo_reward=true;s.phones.push(p);tx('Промокод',0,code+' — '+model[0]+' бесплатно');event('Промокод '+code+' активирован: получен '+model[0]+'.');}else return msg('Промокод не найден или введён неверно.',true);s.redeemed_codes.push(code);save();const message=code==='CASH5000'?'Промокод принят! Начислено 5 000 ₽.':code==='PROFIT'?'Промокод принят! Следующие 5 продаж принесут бонус +15% к выручке.':'Промокод принят! Ты получил '+rewards[code]+' бесплатно.';msg(message);render()}function refreshMarket(){if(s.balance<100)return msg('Обновление рынка стоит 100 ₽. Недостаточно денег.',true);if(s.market.length>=24)return msg('На рынке уже достаточно предложений. Сначала купи несколько телефонов.',true);s.balance-=100;tx('Расходы рынка',-100,'Обновление объявлений');const count=Math.min(4,24-s.market.length);s.market.push(...Array.from({length:count},marketItem));event('Рынок обновлён: новых объявлений — '+count+'.');save();render()}function renderMarketOnly(){let el=$('marketcards');if(!el)return;let arr=s.market.filter(p=>(p.model+' '+p.brand).toLowerCase().includes(filter.toLowerCase())&&(brand==='Все бренды'||p.brand===brand));arr.sort((x,y)=>sort==='Дешёвые'?x.price-y.price:sort==='Дорогие'?y.price-x.price:(x.price/x.market)-(y.price/y.market));el.innerHTML=arr.map(p=>phoneCard(p,'market')).join('')||'<div class="empty">Ничего не найдено</div>'}
function go(t){tab=t;render()}function setSpeed(n){s.speed=n;save();msg(n===0?'Игровое время на паузе.':'Скорость времени: '+n+'×');render()}function changePrice(pid){let p=findPhone(pid),v=+$('price-'+pid).value;if(!p||v<1)return msg('Укажи корректную цену.',true);p.listed_price=v;p.listing_time=s.world_time;save();render()}function delist(pid){let p=findPhone(pid);if(p){p.status='Склад';p.listed_price=0;s.listings=s.listings.filter(x=>x.id!==pid);save();render()}}function diagnose(pid){
 let p=findPhone(pid);
 if(!p)return;
 if(s.balance<150)return msg('Диагностика стоит 150 ₽.\nНедостаточно денег.',true);
 s.balance-=150;
 tx('Диагностика',-150,p.model);
 const found=new Set(Array.isArray(p.defects)?p.defects:[]);
 if(p.hidden_defect){
  found.add(p.hidden_defect);
  p.hidden_defect=null;
 }
 if(p.battery<85)found.add('Изношенный аккумулятор');
 if(p.screen==='Разбит')found.add('Экран разбит');
 if(p.camera==='Неисправна')found.add('Не работает камера');
 if(p.charging==='Проблема')found.add('Проблема с зарядкой');
 p.defects=[...found];
 if(p.defects.includes('Экран разбит'))p.screen='Разбит';
 if(p.defects.includes('Не работает камера'))p.camera='Неисправна';
 if(p.defects.includes('Проблема с зарядкой'))p.charging='Проблема';
 if(p.defects.length){
  event('Диагностика '+p.model+': '+p.defects.join(', ')+'.');
  msg('Обнаруженные неисправности:\n\n'+p.defects.map(d=>'• '+d).join('\n'));
 }else{
  event('Диагностика '+p.model+': неисправностей не обнаружено.');
  msg('Неисправностей не обнаружено.');
 }
 save();
 render();
}
function repairPick(pid){let p=findPhone(pid),options=Object.keys(repairs).map(k=>`<button class="btn secondary full" onclick="closeModal();repair('${pid}','${k}')">${k} · ${money(repairs[k][0])}</button>`).join('');$('modalroot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Ремонт · ${esc(p.model)}</h2><p class="muted">Выбери тип ремонта. Для ремонта нужна подтверждённая неисправность.</p>${options}<button class="btn full" onclick="closeModal()">Отмена</button></div></div>`}
function answerById(mid,reply){let m=s.messages.find(x=>String(x.id)===String(mid));if(!m||m.answered)return;m.answered=true;m.read=true;m.reply=reply;if(reply.startsWith('Да,')||reply.startsWith('Аккумулятор')||reply.startsWith('По имеющимся данным'))s.rep=Math.min(5,+(s.rep+.01).toFixed(2));event('Ответ покупателю '+m.from+': «'+reply+'»');save();render()}function answer(i,reply){let m=s.messages[i];if(m)answerById(m.id,reply)}function newGame(){ $('modalroot').innerHTML=`<div class="modalbg"><div class="modal"><h2>Начать заново?</h2><p>Весь текущий прогресс будет удалён.</p><div class="row"><button class="btn danger" onclick="s=initial();save();closeModal();go('home')">Да, начать</button><button class="btn secondary" onclick="closeModal()">Отмена</button></div></div></div>`}
function renderMarketOnlySafe(){}
render();setInterval(()=>{if(s.speed>0){tick(.25*s.speed);if(Math.random()<.15)render();else{$('balance').textContent=money(s.balance);$('level').textContent=`${s.level} · ${s.xp} XP`;$('rep').textContent=s.rep.toFixed(2)+' ★';$('clock').textContent=clock()}}},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('beforeunload',save);
</script></body></html>
